<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1230" viewBox="0 0 1400 1230" role="img" aria-labelledby="title desc"><title id="title">Inicio</title><desc id="desc">Wireframe de baja fidelidad con versión de escritorio a la izquierda y móvil a la derecha. CodePath, primera entrega.</desc><rect width="1400" height="1230" fill="#ECEEF2"/><g fill="#28303E" font-family="Arial, sans-serif"><text x="40" y="45" font-size="25" font-weight="700">CODEPATH / Inicio</text><text x="40" y="78" font-size="16" font-weight="400">Escritorio · estructura de contenido</text><text x="980" y="78" font-size="16" font-weight="400">Móvil · contenido apilado</text><rect x="40" y="100" width="890" height="1060" rx="10" fill="#fff" stroke="#A4AAB4"/><rect x="980" y="100" width="380" height="1060" rx="10" fill="#fff" stroke="#A4AAB4"/><rect x="55" y="115" width="860" height="60" rx="10" fill="#F0F1F4" stroke="#A4AAB4"/><text x="75" y="153" font-size="22" font-weight="700">&lt;/&gt; CodePath</text><text x="385" y="150" font-size="15" font-weight="400">Inicio     Cursos y tutoriales     Lecciones     Perfil</text><rect x="995" y="115" width="350" height="60" rx="10" fill="#F0F1F4" stroke="#A4AAB4"/><text x="1010" y="153" font-size="20" font-weight="700">&lt;/&gt; CodePath</text><text x="1260" y="150" font-size="14" font-weight="600">☰ Menú</text><text x="75" y="235" font-size="12" font-weight="700">UN COMIENZO PARA TUS IDEAS</text><text x="75" y="285" font-size="34" font-weight="400">Aprendé a programar,</text><text x="75" y="328" font-size="34" font-weight="400">paso a paso</text><text x="75" y="390" font-size="16" font-weight="400">Propuesta para personas sin experiencia.</text><text x="75" y="415" font-size="16" font-weight="400">Tecnologías diferentes y aprendizaje</text><text x="75" y="440" font-size="16" font-weight="400">progresivo mediante conceptos breves.</text><rect x="75" y="480" width="315" height="40" rx="8" fill="#D2D5DB" stroke="#A4AAB4"/><text x="87" y="506" font-size="13" font-weight="600">Explorar cursos y tutoriales →</text><text x="75" y="550" font-size="13" font-weight="400">Catálogo y prácticas disponibles.</text><text x="75" y="572" font-size="13" font-weight="400">Cursos completos próximamente.</text><rect x="530" y="220" width="355" height="340" rx="10" fill="#E9EBEF" stroke="#A4AAB4"/><text x="555" y="252" font-size="14" font-weight="600">mi-primera-pagina.html</text><rect x="550" y="278" width="315" height="160" rx="10" fill="#fff" stroke="#A4AAB4"/><text x="570" y="315" font-size="17" font-weight="400">&lt;h1&gt;¡Hola, mundo!&lt;/h1&gt;</text><text x="570" y="341" font-size="17" font-weight="400">&lt;p&gt;Tu primera página.&lt;/p&gt;</text><rect x="550" y="454" width="315" height="82" rx="10" fill="#fff" stroke="#A4AAB4"/><text x="565" y="480" font-size="10" font-weight="700">VISTA PREVIA ILUSTRATIVA</text><text x="565" y="513" font-size="24" font-weight="700">¡Hola, mundo!</text><text x="75" y="637" font-size="27" font-weight="700">Un recorrido pensado para vos</text><text x="75" y="675" font-size="15" font-weight="400">Alcance actual y funcionalidades futuras, diferenciados.</text><rect x="75" y="710" width="260" height="170" rx="10" fill="#F4F5F7" stroke="#A4AAB4"/><text x="93" y="747" font-size="20" font-weight="700">01 · Aprender</text><text x="93" y="783" font-size="14" font-weight="400">Conceptos breves.</text><text x="93" y="806" font-size="14" font-weight="400">Unidades completas:</text><text x="93" y="829" font-size="14" font-weight="400">próxima etapa.</text><rect x="350" y="710" width="260" height="170" rx="10" fill="#F4F5F7" stroke="#A4AAB4"/><text x="368" y="747" font-size="20" font-weight="700">02 · Practicar</text><text x="368" y="783" font-size="14" font-weight="400">Preguntas y devolución</text><text x="368" y="806" font-size="14" font-weight="400">inmediata, disponibles.</text><rect x="625" y="710" width="260" height="170" rx="10" fill="#F4F5F7" stroke="#A4AAB4"/><text x="643" y="747" font-size="20" font-weight="700">03 · Progresar</text><text x="643" y="783" font-size="14" font-weight="400">Resultados de la sesión.</text><text x="643" y="806" font-size="14" font-weight="400">Guardado del progreso:</text><text x="643" y="829" font-size="14" font-weight="400">próxima etapa.</text><rect x="75" y="915" width="810" height="125" rx="10" fill="#F0F1F4" stroke="#A4AAB4"/><text x="95" y="954" font-size="24" font-weight="700">Descubrí qué te gustaría crear</text><text x="95" y="987" font-size="15" font-weight="400">Nueve cursos y tutoriales, desde el catálogo.</text><rect x="660" y="954" width="195" height="40" rx="8" fill="#fff" stroke="#A4AAB4"/><text x="672" y="980" font-size="13" font-weight="600">Ver el catálogo →</text><text x="75" y="1128" font-size="14" font-weight="400">&lt;/&gt; CodePath     ·     Primera entrega / En construcción</text><rect x="1010" y="200" width="320" height="43" rx="10" fill="#F3F4F6" stroke="#A4AAB4"/><text x="1023" y="228" font-size="13" font-weight="600">Menú alternativo: cuatro accesos</text><text x="1010" y="281" font-size="25" font-weight="400">Aprendé a programar,</text><text x="1010" y="315" font-size="25" font-weight="400">paso a paso</text><text x="1010" y="362" font-size="14" font-weight="400">Propuesta educativa, desde cero.</text><text x="1010" y="385" font-size="14" font-weight="400">Diferentes tecnologías y conceptos</text><text x="1010" y="408" font-size="14" font-weight="400">breves antes de cada actividad.</text><rect x="1010" y="433" width="320" height="40" rx="8" fill="#D2D5DB" stroke="#A4AAB4"/><text x="1022" y="459" font-size="13" font-weight="600">Explorar cursos y tutoriales →</text><text x="1010" y="504" font-size="12" font-weight="400">Prácticas listas. Cursos próximamente.</text><rect x="1010" y="529" width="320" height="170" rx="10" fill="#E9EBEF" stroke="#A4AAB4"/><text x="1028" y="560" font-size="14" font-weight="600">Ejemplo de código + vista previa</text><text x="1030" y="601" font-size="15" font-weight="400">&lt;h1&gt;¡Hola, mundo!&lt;/h1&gt;</text><text x="1030" y="625" font-size="15" font-weight="400">Una primera página ilustrativa.</text><text x="1010" y="740" font-size="23" font-weight="700">Un recorrido para vos</text><rect x="1010" y="763" width="320" height="78" rx="10" fill="#F3F4F6" stroke="#A4AAB4"/><text x="1027" y="792" font-size="17" font-weight="700">01 · Aprender</text><text x="1027" y="818" font-size="13" font-weight="400">Conceptos; unidades previstas.</text><rect x="1010" y="854" width="320" height="78" rx="10" fill="#F3F4F6" stroke="#A4AAB4"/><text x="1027" y="883" font-size="17" font-weight="700">02 · Practicar</text><text x="1027" y="909" font-size="13" font-weight="400">Preguntas con explicación.</text><rect x="1010" y="945" width="320" height="78" rx="10" fill="#F3F4F6" stroke="#A4AAB4"/><text x="1027" y="974" font-size="17" font-weight="700">03 · Progresar</text><text x="1027" y="1000" font-size="13" font-weight="400">Resultados; guardado pendiente.</text><rect x="1010" y="1050" width="320" height="40" rx="8" fill="#fff" stroke="#A4AAB4"/><text x="1022" y="1076" font-size="13" font-weight="600">Ver el catálogo →</text><text x="1010" y="1130" font-size="12" font-weight="400">Pie · Primera entrega / En construcción</text><text x="40" y="1201" font-size="15" font-weight="400">Lectura: portada → catálogo → práctica. El menú móvil se abre y se cierra; no oculta los accesos sin alternativa.</text></g></svg>